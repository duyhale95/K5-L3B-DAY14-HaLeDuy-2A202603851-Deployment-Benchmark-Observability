services:
  - type: web
    name: day14-agent-haleduy
    runtime: docker
    plan: free
    region: singapore
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: AGENT_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis-haleduy
          property: connectionString
  - type: keyvalue
    name: day14-redis-haleduy
    region: singapore
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
